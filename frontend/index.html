<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SGGo! — Cẩm Nang Du Lịch & Lập Lịch Trình Thông Minh Sài Gòn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10.7" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Leaflet Map Library CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] font-['Plus_Jakarta_Sans',sans-serif] min-h-screen antialiased flex flex-col">

  <div class="pop-glow-orange"></div>
  <div class="pop-glow-teal"></div>

  <div class="w-full max-w-[1600px] 2xl:max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 pt-2.5 md:pt-3.5 pb-2 relative z-10">
    
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-center pb-3 mb-3 border-b border-slate-200/80 gap-3">
      <!-- Logo -->
      <div class="flex items-center gap-3 cursor-pointer flex-shrink-0" onclick="switchMode('flow')">
        <div class="w-11 h-11 min-w-[44px] min-h-[44px] flex-shrink-0 aspect-square rounded-2xl bg-[#E11D48] flex items-center justify-center text-white shadow-md shadow-[#E11D48]/25 transition hover:scale-105">
          <i class="fa-solid fa-location-arrow text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-2xl font-black tracking-tight text-slate-900">
              SG<span class="text-[#E11D48]">Go!</span>
            </h1>
            <span class="text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-[#FFE4E6] text-[#E11D48] border border-[#FDA4AF]/50">
              Sài Gòn • TP. Hồ Chí Minh
            </span>
          </div>
          <p class="text-xs text-slate-500 font-medium mt-0.5">Cẩm nang ẩm thực & Lập lịch trình khám phá thông minh Sài Gòn (TP.HCM)</p>
        </div>
      </div>

      <!-- Navigation & Auth -->
      <div class="flex flex-wrap sm:flex-nowrap items-center justify-center gap-2 sm:gap-3">
        <nav class="flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200/80 text-xs font-semibold overflow-x-auto max-w-full">
          <button onclick="switchMode('flow')" id="navFlow" class="tab-pill active whitespace-nowrap">Khám Phá Nhanh</button>
          <button onclick="switchMode('all')" id="navAll" class="tab-pill whitespace-nowrap">Tự Chọn (<span id="totalPlacesCount">--</span>)</button>
          <button onclick="switchMode('ai')" id="navAI" class="tab-pill whitespace-nowrap"><i class="fa-solid fa-route mr-1.5"></i>Lập Lịch Trình</button>
          <button onclick="switchMode('admin')" id="navAdmin" class="tab-pill hidden text-[#E11D48] font-bold whitespace-nowrap" style="display: none !important;">
            <i class="fa-solid fa-gear mr-1.5"></i> Quản Trị Hệ Thống
          </button>
        </nav>

        <!-- Nút Tài Khoản (Được bảo vệ không bao giờ bị rớt dòng) -->
        <div id="authContainer" class="flex-shrink-0 flex items-center whitespace-nowrap">
          <button onclick="openAuthModal()" id="btnAuth" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 shadow-sm transition flex items-center gap-1.5 whitespace-nowrap">
            <i class="fa-regular fa-user text-slate-400"></i>
            <span id="authButtonText">Đăng nhập</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 1. FLOW TRẮC NGHIỆM GỢI Ý (THIẾT KẾ DÀNH RIÊNG CHO NGƯỜI LƯỜI - ÍT CHỮ, RA QUÁN NGAY) -->
    <main id="viewFlow" class="w-full py-2">

      <!-- THANH TÓM TẮT ĐANG CHỌN (STEPPER 3 CỘT CÂN ĐỐI) & VỊ TRÍ GPS DÙNG CHUNG CẢ 3 TAB -->
      <div class="max-w-xl mx-auto mb-6">
        <!-- Hàng tiêu đề trên: Tóm tắt tiến trình & Nút GPS tùy chọn đồng bộ 3 Tab -->
        <div class="flex items-center justify-between mb-2 px-1">
          <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-1.5 select-none">
            <i class="fa-solid fa-sliders text-[#E11D48] text-xs"></i> Lựa chọn của bạn
          </span>
          <button type="button" onclick="toggleFlowGpsPriority()" id="btnFlowToggleGps" class="text-[11px] font-bold px-3 py-1 rounded-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 transition flex items-center gap-1.5 shadow-2xs cursor-pointer select-none" title="Bấm 1 lần dùng chung GPS cho cả 3 Tab (Ưu tiên quán gần bạn)">
            <i class="fa-solid fa-location-crosshairs text-slate-400 text-xs"></i>
